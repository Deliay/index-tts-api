name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Expects repository secrets:
      #   DOCKER_ENDPOINT  registry host, also used as the image prefix
      #   DOCKER_USER      registry user
      #   DOCKER_PASSWORD  registry password or token
      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_ENDPOINT }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: |
            ${{ secrets.DOCKER_ENDPOINT }}/zero-tools/index-tts-api:${{ github.sha }}
            ${{ secrets.DOCKER_ENDPOINT }}/zero-tools/index-tts-api:latest
          push: true
          provenance: false
          sbom: false
